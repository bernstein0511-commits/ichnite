<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <link rel="icon" href="../icons/icon_maincolor.png" />
    <title>Ichnite</title>
  </head>
  <body>
    <div class="panel">
      <header class="panel-header">
        <div class="header-left">
          <img src="../icons/icon_maincolor.png" alt="" id="menu-icon" />
          <span id="menu-title">Ichnite</span>
        </div>
        <button class="close-btn">✕</button>
      </header>

      <section class="controls">
        <div class="toggle-row">
          <div class="toggle-label">マーカー</div>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <div class="toggle-label">ポップアップ</div>
          <label class="switch">
            <input type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>

        <button class="record-book">記録帳</button>
      </section>

      <hr class="thin-sep" />

      <section class="page-only">
        <label><input type="checkbox" /> このページのみ表示</label>
      </section>

      <section class="cards" id="cardsContainer">
        <!-- カードは拡張機能のデータがある場合にのみ JS で挿入します -->
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
